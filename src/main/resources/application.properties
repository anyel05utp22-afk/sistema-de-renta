# ================== Servidor ==================
server.port=8080
spring.application.name=cuotas-mantenimiento

# ================== MySQL ==================
# La base de datos "edificio_cruceta" se crea sola si no existe.
spring.datasource.url=jdbc:mysql://localhost:3306/edificio_cruceta?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=admin
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Ejecuta schema.sql y data.sql en cada inicio (son idempotentes)
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# ================== Archivos (comprobantes) ==================
app.uploads-dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

spring.jackson.time-zone=America/Lima
