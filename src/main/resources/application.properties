# ================== Servidor ==================
server.port=${PORT:8080}
spring.application.name=cuotas-mantenimiento

# Carga variables locales desde .env (ignorado por Git) si existe; las variables de entorno del sistema tienen prioridad
spring.config.import=optional:file:.env[.properties]

# ================== MySQL ==================
# Compatible tanto en local (via variables de entorno o .env) como en Railway (MYSQLHOST, MYSQLUSER, etc.)
spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:edificio_cruceta}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima&characterEncoding=UTF-8
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Ejecuta schema.sql y data.sql en cada inicio (son idempotentes)
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# ================== Seguridad ==================
app.security.max-login-attempts=${MAX_LOGIN_ATTEMPTS:5}
app.security.lockout-minutes=${LOCKOUT_MINUTES:15}
app.security.session-timeout-minutes=${SESSION_TIMEOUT_MINUTES:30}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://127.0.0.1:8080,http://localhost:5500,http://127.0.0.1:5500,http://localhost:5173,http://localhost:3000}

# ================== Archivos (comprobantes) ==================
app.uploads-dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

spring.jackson.time-zone=America/Lima
