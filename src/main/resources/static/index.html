function Login({ alEntrar }) {
    const [correo, setCorreo] = useState("");
    const [contrasena, setContrasena] = useState("");
    const [recuperar, setRecuperar] = useState(false);
    const [res, setRes] = useState(null);

    const entrar = async (e) => {
        e.preventDefault();
        setRes(null);
        try {
            const r = await API.post("/api/auth/login", { correo, contrasena });
            sessionStorage.setItem("token", r.token);
            sessionStorage.setItem("usuario", JSON.stringify(r.usuario));
            alEntrar(r.usuario);
        } catch (er) {
            setRes({ ok: false, titulo: "¡Credenciales Incorrectas!", mensaje: er.message });
        }
    };

    const enviarRecuperacion = (e) => {
        e.preventDefault();
        if (!correo.trim()) {
            setRes({ ok: false, titulo: "Ingrese su correo", mensaje: "Debe ingresar el correo electrónico de su cuenta." });
            return;
        }
        // Flujo alternativo RF-005: mensaje generico sin revelar si el correo existe
        setRes({
            ok: true,
            titulo: "¡Solicitud procesada!",
            mensaje: "Si el correo ingresado corresponde a una cuenta registrada, recibirá las instrucciones para restablecer su contraseña."
        });
    };

    const rapido = (c, p) => { setCorreo(c); setContrasena(p); setRes(null); };

    return (
        <div>
            <div className="header">
                <h1>SISTEMA WEB "EDIFICIO LA CRUCETA"</h1>
                <div className="sub">Sistema de Cobro de Cuotas de Mantenimiento</div>
            </div>
            <div className="card login">
                {recuperar ? (
                    <form onSubmit={enviarRecuperacion}>
                        <h2>Recuperar contraseña (RF-005)</h2>
                        <Resultado res={res} />
                        <Campo label="Correo Electrónico Registrado:">
                            <input type="email" value={correo} onChange={(e) => setCorreo(e.target.value)} placeholder="correo@ejemplo.com" />
                        </Campo>
                        <button className="btn bloque">Enviar instrucciones</button>
                        <button type="button" className="btn blanco bloque" style={{ marginTop: 8 }}
                            onClick={() => { setRecuperar(false); setRes(null); }}>Volver a iniciar sesión</button>
                    </form>
                ) : (
                    <form onSubmit={entrar}>
                        <h2>Iniciar Sesión (RF-003)</h2>
                        <Resultado res={res} />
                        <Campo label="Correo Electrónico / Usuario:">
                            <input type="email" value={correo} onChange={(e) => setCorreo(e.target.value)} placeholder="admin@cruceta.com" />
                        </Campo>
                        <div style={{ marginTop: 12 }}>
                            <Campo label="Contraseña:">
                                <input type="password" value={contrasena} onChange={(e) => setContrasena(e.target.value)} placeholder="••••••••" />
                            </Campo>
                        </div>
                        <button className="btn bloque">Ingresar al Sistema</button>
                        <button type="button" className="btn blanco bloque" style={{ marginTop: 8 }}
                            onClick={() => { setRecuperar(true); setRes(null); }}>¿Olvidó su contraseña?</button>

                        <div className="demo" style={{ marginTop: 16 }}>
                            <b>Cuentas de prueba predefinidas (clic para autocompletar):</b>
                            <div style={{ marginTop: 8 }}>
                                <div style={{ fontSize: "0.82rem", color: "#64748b", marginBottom: 4, fontWeight: "600" }}>
                                    Administración del Edificio:
                                </div>
                                <button
                                    type="button"
                                    className="btn chico"
                                    style={{ width: "100%", justifyContent: "center", padding: "8px 12px" }}
                                    onClick={() => rapido("admin@cruceta.com", "admin123")}
                                >
                                    🛡️ Administrador (La Directiva) — admin@cruceta.com
                                </button>
                            </div>

                            <div style={{ marginTop: 12 }}>
                                <div style={{ fontSize: "0.82rem", color: "#64748b", marginBottom: 4, fontWeight: "600" }}>
                                    Inquilinos / Propietarios (20 departamentos):

                                <select
                                    style={{ width: "100%", padding: "8px 10px", borderRadius: "6px", border: "1px solid #cbd5e1", background: "#f8fafc", fontSize: "0.88rem" }}
                                    defaultValue=""
                                    onChange={(e) => {
                                        if (e.target.value) rapido(e.target.value, "123456");
                                    }}
                                >
                                    <option value="" disabled>-- Seleccione un departamento / inquilino (101 a 504) --</option>
                                    {INQUILINOS_DEMO.map((inq) => (
                                        <option key={inq.correo} value={inq.correo}>
                                            {inq.dpto} ({inq.piso}) — {inq.nombre}
                                        </option>
                                    ))}
                                </select>
                            </div>
                        </div>
                    </form>
                )}
            </div>
        </div>
    );
}

function App() {
    const guardado = () => {
        try { return JSON.parse(sessionStorage.getItem("usuario")); } catch (e) { return null; }
    };
    const [usuario, setUsuario] = useState(guardado);
    const [vista, setVista] = useState(usuario && usuario.rol === "ADMINISTRADOR" ? "dashboard" : "estado");
    const [params, setParams] = useState(null);
    const [menuAbierto, setMenuAbierto] = useState(false);

    useEffect(() => {
        const limpiar = () => setUsuario(null);
        window.addEventListener("sesion-expirada", limpiar);
        return () => window.removeEventListener("sesion-expirada", limpiar);
    }, []);

    if (!usuario) return <Login alEntrar={(u) => {
        setUsuario(u);
        setVista(u.rol === "ADMINISTRADOR" ? "dashboard" : "estado");
    }} />;

    const esAdmin = usuario.rol === "ADMINISTRADOR";
    const ir = (v, p) => { setParams(p || null); setVista(v); setMenuAbierto(false); };

    const salir = async () => {
        try { await API.post("/api/auth/logout"); } catch (e) { /* ignorar */ }
        sessionStorage.clear();
        setUsuario(null);
    };

    const menu = esAdmin ? [
        ["dashboard", "Consultar dashboard administrativo"],
        ["rendicion", "Rendición de cuentas e historial"],
        ["movimientos", "Movimientos financieros y auditoría"],
        ["morosidad", "Reporte de morosidad"],
        ["cuotas", "Cuotas emitidas"],
        ["pagos", "Pagos y comprobantes"],
        ["registrar-pago", "Registrar pago"],
        ["constancias", "Constancias de pago"],
        ["estado", "Estado de cuenta"],
        ["conceptos", "Conceptos de cobro y gastos"],
        ["unidades", "Departamentos (Unidades)"],
        ["usuarios", "Propietarios / Usuarios"],
        ["perfil", "Mi perfil"],
    ] : [
        ["estado", "Mi estado de cuenta"],
        ["cuotas", "Mis cuotas"],
        ["registrar-pago", "Registrar pago"],
        ["pagos", "Mis pagos realizados"],
        ["constancias", "Mis constancias"],
        ["perfil", "Mi perfil"],
    ];

    return (
        <div>
            <div className="header">
                <div className="header-container">
                    <button className="btn-hamburguesa" onClick={() => setMenuAbierto(!menuAbierto)} aria-label="Menú">
                        {menuAbierto ? "✕" : "☰"}
                    </button>
                    <div className="header-titulos">
                        <h1>SISTEMA WEB "EDIFICIO LA CRUCETA"</h1>
                        <div className="sub">Cobro y Gestión de Cuotas de Mantenimiento</div>
                        <div className="user">
                            Usuario: <b>{usuario.nombreCompleto}</b> ({usuario.rol})
                            {usuario.unidad ? ` — ${usuario.unidad}` : ""}
                        </div>
                    </div>
                </div>
            </div>
            <div className="layout">
                <div className={"sidebar" + (menuAbierto ? " abierta" : "")}>
                    {menu.map(([id, texto]) => (
                        <button key={id} className={vista === id ? "activo" : ""} onClick={() => ir(id)}>
                            {texto}
                        </button>
                    ))}
                    <button className="salir" onClick={salir}>Cerrar sesión</button>
                </div>
                <div className="main">
                    {vista === "dashboard" && <Dashboard ir={ir} />}
                    {vista === "rendicion" && <RendicionCuentas />}
                    {vista === "movimientos" && <Movimientos />}
                    {vista === "conceptos" && <Conceptos />}
                    {vista === "cuotas" && <ListaCuotas usuario={usuario} ir={ir} />}
                    {vista === "estado" && <EstadoCuenta usuario={usuario} ir={ir} />}
                    {vista === "registrar-pago" && <RegistrarPago usuario={usuario} params={params} ir={ir} />}
                    {vista === "pagos" && <ListaPagos usuario={usuario} />}
                    {vista === "constancias" && <Constancias usuario={usuario} />}
                    {vista === "morosidad" && <Morosidad />}
                    {vista === "unidades" && <Unidades />}
                    {vista === "usuarios" && <Usuarios />}
                    {vista === "perfil" && <Perfil />}
                </div>
            </div>
        </div>
    );
}
