// =============================================================
//  Comunicacion con el backend (Spring Boot)  ->  /api/...
//  Funciona tanto en http://localhost:8080 como abriendo index.html
//  directamente o con Live Server.
// =============================================================
const BASE_API = (window.location.port === "8080" && window.location.protocol.startsWith("http"))
    ? ""
    : "http://localhost:8080";

const API = {
    token() {
        return sessionStorage.getItem("token");
    },

    async request(metodo, url, cuerpo, esFormulario) {
        const opciones = { method: metodo, headers: {} };
        if (API.token()) opciones.headers["Authorization"] = "Bearer " + API.token();
        if (cuerpo !== undefined) {
            if (esFormulario) {
                opciones.body = cuerpo; // FormData (con archivo)
            } else {
                opciones.headers["Content-Type"] = "application/json";
                opciones.body = JSON.stringify(cuerpo);
            }
        }
        let res;
        try {
            res = await fetch(BASE_API + url, opciones);
        } catch (err) {
            throw new Error("No se pudo conectar al servidor Java (http://localhost:8080). Ejecuta iniciar.bat o presiona F5 en VS Code.");
        }
        let datos = null;
        try { datos = await res.json(); } catch (e) { /* respuesta sin cuerpo */ }
        if (!res.ok) {
            const error = new Error((datos && (datos.error || datos.message)) || "Error de comunicacion con el servidor.");
            error.status = res.status;
            if (res.status === 401 && !url.endsWith("/login")) {
                sessionStorage.clear();
                window.dispatchEvent(new Event("sesion-expirada"));
            }
            throw error;
        }
        return datos;
    },

    get: (url) => API.request("GET", url),
    post: (url, cuerpo) => API.request("POST", url, cuerpo === undefined ? {} : cuerpo),
    put: (url, cuerpo) => API.request("PUT", url, cuerpo),
    form: (url, formData) => API.request("POST", url, formData, true),

    urlComprobante: (idComprobante) => `${BASE_API}/api/comprobantes/${idComprobante}/archivo?token=${API.token()}`,
};


// =============================================================
//  Componentes y utilidades comunes de la interfaz
// =============================================================
const { useState, useEffect, useCallback } = React;

const MESES = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio",
    "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];

function soles(n) {
    const v = Number(n || 0);
    return "S/. " + v.toLocaleString("es-PE", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function periodoTexto(p) {
    if (!p) return "";
    const [a, m] = p.split("-");
    return MESES[Number(m) - 1] + " " + a;
}

function fechaTexto(f) {
    if (!f) return "";
    const [a, m, d] = f.substring(0, 10).split("-");
    return `${d}/${m}/${a}`;
}

function hoyISO() {
    const d = new Date();
    d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
    return d.toISOString().substring(0, 10);
}

/** Hook para cargar datos del backend. */
function useDatos(url, deps) {
    const [datos, setDatos] = useState(null);
    const [error, setError] = useState(null);
    const recargar = useCallback(() => {
        if (!url) { setDatos(null); return; }
        setError(null);
        API.get(url).then(setDatos).catch((e) => setError(e.message));
    }, [url]);
    useEffect(recargar, [recargar].concat(deps || []));
    return [datos, recargar, error];
}

function Alerta({ tipo, titulo, children }) {
    if (!titulo && !children) return null;
    return (
        <div className={"alerta " + (tipo || "info")}>
            {titulo && <b>{titulo}</b>}
            {children}
        </div>
    );
}

/** Mensaje de resultado (exito / error) que se muestra arriba del formulario. */
function Resultado({ res }) {
    if (!res) return null;
    return res.ok
        ? <Alerta tipo="ok" titulo={res.titulo || "¡Operación exitosa!"}>{res.mensaje}</Alerta>
        : <Alerta tipo="error" titulo={res.titulo || "¡Error en los datos!"}>{res.mensaje}</Alerta>;
}

function Campo({ label, children, className, ayuda }) {
    return (
        <div className={className}>
            <label>{label}</label>
            {children}
            {ayuda && <div className="ayuda">{ayuda}</div>}
        </div>
    );
}

const COLOR_ESTADO = {
    PAGADA: "b-verde", VALIDADO: "b-verde", ACTIVO: "b-verde", ACTIVA: "b-verde", "AL DIA": "b-verde",
    PENDIENTE: "b-amarillo", EN_REVISION: "b-amarillo", DEUDOR: "b-amarillo",
    VENCIDA: "b-rojo", MOROSO: "b-rojo", RECHAZADO: "b-rojo", INACTIVO: "b-gris", INACTIVA: "b-gris",
};
const TEXTO_ESTADO = {
    EN_REVISION: "Pagado en revisión",
    VALIDADO: "Verificado",
    DEUDOR: "Deudor (< 30 días)",
    MOROSO: "Moroso (> 30 días)",
    "AL DIA": "Al día",
    VENCIDA: "Vencida",
};

function Estado({ valor, diasAtraso, condicionDeuda }) {
    if (!valor) return null;
    let v = valor;
    if (condicionDeuda) {
        v = condicionDeuda;
    } else if (valor === "VENCIDA") {
        if (diasAtraso !== undefined && diasAtraso !== null) {
            v = Number(diasAtraso) > 30 ? "MOROSO" : "DEUDOR";
        }
    }
    const texto = TEXTO_ESTADO[v] || (v.charAt(0) + v.slice(1).toLowerCase());
    return <span className={"badge " + (COLOR_ESTADO[v] || "b-gris")}>{texto}</span>;
}

function Cargando({ error }) {
    if (error) return <Alerta tipo="error" titulo="No se pudo cargar la información">{error}</Alerta>;
    return <p className="vacio">Cargando...</p>;
}

function FilaVacia({ cols, texto }) {
    return <tr><td colSpan={cols} className="vacio">{texto || "No hay registros."}</td></tr>;
}

/** Convierte una lista de objetos en un CSV descargable (RF-036 Exportar reporte). */
function exportarCSV(nombre, columnas, filas) {
    const enc = columnas.map((c) => c.titulo).join(";");
    const cuerpo = filas.map((f) => columnas.map((c) => String(c.valor(f) ?? "").replace(/;/g, ",")).join(";")).join("\n");
    const blob = new Blob(["\ufeff" + enc + "\n" + cuerpo], { type: "text/csv;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = nombre;
    a.click();
}

/** RF-012 Consultar cuota (lista) con acciones segun el rol. */
function ListaCuotas({ usuario, ir }) {
    const esAdmin = usuario.rol === "ADMINISTRADOR";
    const esGestion = esAdmin || usuario.rol === "JUNTA DIRECTIVA" || usuario.rol === "JUNTA";
    const [periodos] = useDatos("/api/cuotas/periodos");
    const [periodo, setPeriodo] = useState("");
    const [estado, setEstado] = useState("");
    const [busqueda, setBusqueda] = useState("");
    const [cuotas, recargar, error] = useDatos(`/api/cuotas?periodo=${periodo}&estado=${estado}`);
    const [seleccion, setSeleccion] = useState(null); // {id, modo: 'aviso' | 'editar'}
    const [res, setRes] = useState(null);

    const detectar = async () => {
        try {
            const r = await API.post("/api/cuotas/detectar-vencidas");
            setRes({ ok: true, titulo: "Detección de cuotas vencidas", mensaje: r.mensaje });
            recargar();
        } catch (e) { setRes({ ok: false, mensaje: e.message }); }
    };

    const enviarRecordatorio = async (c) => {
        try {
            const r = await API.post(`/api/cuotas/${c.id_cuota}/recordatorio`);
            setRes({ ok: true, titulo: "Recordatorio enviado", mensaje: r.mensaje });
        } catch (e) { setRes({ ok: false, mensaje: e.message }); }
    };

    const recordatorioMasivo = async () => {
        try {
            const r = await API.post(`/api/cuotas/recordatorio-masivo${periodo ? "?periodo=" + periodo : ""}`);
            setRes({ ok: true, titulo: "Recordatorio masivo de cobro", mensaje: r.mensaje });
        } catch (e) { setRes({ ok: false, mensaje: e.message }); }
    };

    if (seleccion && seleccion.modo === "aviso")
        return <AvisoCobro idCuota={seleccion.id} volver={() => setSeleccion(null)} />;
    if (seleccion && seleccion.modo === "editar")
        return <EditarCuota idCuota={seleccion.id} volver={() => { setSeleccion(null); recargar(); }} />;

    const cuotasFiltradas = (cuotas || []).filter((c) => {
        if (!busqueda.trim()) return true;
        const b = busqueda.toLowerCase();
        return (c.propietario && c.propietario.toLowerCase().includes(b)) ||
               (c.unidad && c.unidad.toLowerCase().includes(b));
    });

    return (
        <div className="card">
            <h2>{esGestion ? "Cuotas de mantenimiento emitidas" : "Mis cuotas de mantenimiento"}</h2>
            <Resultado res={res} />
            <div className="barra">
                {esGestion && (
                    <Campo label="Buscar por nombre:">
                        <input
                            type="text"
                            placeholder="Nombre del propietario..."
                            value={busqueda}
                            onChange={(e) => setBusqueda(e.target.value)}
                        />
                    </Campo>
                )}
                <Campo label="Periodo">
                    <select value={periodo} onChange={(e) => setPeriodo(e.target.value)}>
                        <option value="">Todos</option>
                        {(periodos || []).map((p) => <option key={p} value={p}>{periodoTexto(p)}</option>)}
                    </select>
                </Campo>
                <Campo label="Estado">
                    <select value={estado} onChange={(e) => setEstado(e.target.value)}>
                        <option value="">Todos</option>
                        <option value="PENDIENTE">Pendiente</option>
                        <option value="PAGADA">Pagada</option>
                        <option value="VENCIDA">Vencida</option>
                    </select>
                </Campo>
                {esAdmin && <button className="btn gris" onClick={detectar}>Detectar vencidas</button>}
                {esGestion && <button className="btn blanco" title="Enviar recordatorio de cobro a todos los pendientes" onClick={recordatorioMasivo}>Recordatorio masivo</button>}
            </div>
            {!cuotas ? <Cargando error={error} /> : (
                <div className="tabla-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>Periodo</th>{esGestion && <th>Unidad</th>}{esGestion && <th>Propietario</th>}
                                <th>Vence</th><th className="num">Monto</th><th className="num">Pagado</th>
                                <th className="num">Saldo</th><th>Estado</th><th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            {cuotasFiltradas.length === 0 && <FilaVacia cols={9} />}
                            {cuotasFiltradas.map((c) => (
                                <tr key={c.id_cuota}>
                                    <td>{periodoTexto(c.periodo)}</td>
                                    {esGestion && <td>{c.unidad}</td>}
                                    {esGestion && <td>{c.propietario || "-"}</td>}
                                    <td>{fechaTexto(c.fecha_vencimiento)}</td>
                                    <td className="num">{Number(c.monto_total).toFixed(2)}</td>
                                    <td className="num">{Number(c.monto_pagado).toFixed(2)}</td>
                                    <td className="num">{Number(c.saldo).toFixed(2)}</td>
                                    <td>
                                        {Number(c.monto_en_revision) > 0 ? (
                                            <span className="badge b-amarillo">Pagado en revisión</span>
                                        ) : (
                                            <Estado valor={c.estado_cuota} diasAtraso={c.dias_atraso} condicionDeuda={c.condicion_deuda} />
                                        )}
                                    </td>
                                    <td className="acciones">
                                        <button className="btn chico blanco" onClick={() => setSeleccion({ id: c.id_cuota, modo: "aviso" })}>Aviso</button>
                                        {esAdmin && c.estado_cuota !== "PAGADA" && Number(c.monto_pagado) === 0 &&
                                            <button className="btn chico gris" onClick={() => setSeleccion({ id: c.id_cuota, modo: "editar" })}>Editar</button>}
                                        {esGestion && c.estado_cuota !== "PAGADA" &&
                                            <button className="btn chico blanco" title="Enviar recordatorio de cobro" onClick={() => enviarRecordatorio(c)}>Recordatorio</button>}
                                        {c.estado_cuota !== "PAGADA" && Number(c.saldo) - Number(c.monto_en_revision) > 0 &&
                                            <button className="btn chico verde" onClick={() => ir("registrar-pago", { idCuota: c.id_cuota })}>Pagar</button>}
                                    </td>
                                </tr>
                            ))}
                        </tbody>
                    </table>
                </div>
            )}
        </div>
    );
}

/** RF-014 Descargar aviso de cobro (vista imprimible / guardar como PDF). */
function AvisoCobro({ idCuota, volver }) {
    const [c, , error] = useDatos(`/api/cuotas/${idCuota}`);
    if (!c) return <Cargando error={error} />;
    return (
        <div className="card">
            <div className="no-print acciones" style={{ marginBottom: 10 }}>
                <button className="btn gris" onClick={volver}>← Volver</button>
                <button className="btn" onClick={() => window.print()}>Imprimir / Descargar PDF</button>
            </div>
            <div className="documento">
                <div className="doc-head">
                    <h2>AVISO DE COBRO</h2>
                    <div>Edificio "La Cruceta" — Cuota de mantenimiento</div>
                </div>
                <div className="grid">
                    <div><b>Propietario:</b> {c.propietario || "-"}</div>
                    <div><b>Unidad:</b> {c.unidad}</div>
                    <div><b>Periodo:</b> {periodoTexto(c.periodo)}</div>
                    <div><b>Estado:</b> {Number(c.monto_en_revision) > 0 ? <span className="badge b-amarillo">Pagado en revisión</span> : <Estado valor={c.estado_cuota} diasAtraso={c.dias_atraso} condicionDeuda={c.condicion_deuda} />}</div>
                    <div><b>Fecha de emisión:</b> {fechaTexto(c.fecha_emision)}</div>
                    <div><b>Fecha de vencimiento:</b> {fechaTexto(c.fecha_vencimiento)}</div>
                </div>
                <h3>Detalle de gastos del edificio (parte que corresponde al departamento)</h3>
                <div className="tabla-responsive">
                    <table>
                        <thead><tr><th>Concepto</th><th className="num">Monto (S/.)</th></tr></thead>
                        <tbody>
                            {c.detalles.map((d) => (
                                <tr key={d.id_concepto}><td>{d.nombre_concepto}</td><td className="num">{Number(d.monto_concepto).toFixed(2)}</td></tr>
                            ))}
                        </tbody>
                    </table>
                </div>
                <div className="total">Total cuota: {soles(c.monto_total)}</div>
                <div className="total" style={{ fontSize: 15 }}>Pagado: {soles(c.monto_pagado)} &nbsp; | &nbsp; Saldo: {soles(c.saldo)}</div>
                <p className="ayuda">Pague en efectivo a La Directiva o mediante Yape y registre su comprobante en el sistema antes de la fecha de vencimiento.</p>
            </div>
        </div>
    );
}

/** RF-015 Editar cuota (solo si no esta pagada). */
function EditarCuota({ idCuota, volver }) {
    const [c, , error] = useDatos(`/api/cuotas/${idCuota}`);
    const [venc, setVenc] = useState("");
    const [detalles, setDetalles] = useState([]);
    const [res, setRes] = useState(null);

    useEffect(() => {
        if (c) { setVenc(c.fecha_vencimiento); setDetalles(c.detalles.map((d) => ({ ...d }))); }
    }, [c]);

    const guardar = async () => {
        try {
            const r = await API.put(`/api/cuotas/${idCuota}`, { fecha_vencimiento: venc, detalles });
            setRes({ ok: true, titulo: "¡Cuota editada exitosamente!", mensaje: r.mensaje });
        } catch (e) { setRes({ ok: false, titulo: "¡No se pudo editar la cuota!", mensaje: e.message }); }
    };

    if (!c) return <Cargando error={error} />;
    const total = detalles.reduce((s, d) => s + Number(d.monto_concepto || 0), 0);
    return (
        <div className="card">
            <button className="btn gris" onClick={volver}>← Volver</button>
            <h2 style={{ marginTop: 14 }}>Editar cuota — {c.unidad} / {periodoTexto(c.periodo)}</h2>
            <Resultado res={res} />
            <div className="grid">
                <Campo label="Fecha de vencimiento:"><input type="date" value={venc} onChange={(e) => setVenc(e.target.value)} /></Campo>
                <Campo label="Total de la cuota:"><input value={soles(total)} disabled /></Campo>
            </div>
            <div className="tabla-responsive" style={{ marginTop: 14 }}>
                <table>
                    <thead><tr><th>Concepto</th><th style={{ width: 180 }}>Monto (S/.)</th></tr></thead>
                    <tbody>
                        {detalles.map((d, i) => (
                            <tr key={d.id_concepto}>
                                <td>{d.nombre_concepto}</td>
                                <td><input type="number" step="0.01" value={d.monto_concepto}
                                    onChange={(e) => { const n = [...detalles]; n[i] = { ...d, monto_concepto: e.target.value }; setDetalles(n); }} /></td>
                            </tr>
                        ))}
                    </tbody>
                </table>
            </div>
            <button className="btn verde bloque" onClick={guardar}>Guardar cambios</button>
        </div>
    );
}

/** RF-013 Consultar estado de cuenta (admin elige la unidad; propietario ve la suya). */
function EstadoCuenta({ usuario, ir }) {
    const esAdmin = usuario.rol === "ADMINISTRADOR";
    const [unidades] = useDatos(esAdmin ? "/api/unidades" : null);
    const [idUnidad, setIdUnidad] = useState(esAdmin ? "" : usuario.idUnidad);
    const [busqueda, setBusqueda] = useState("");
    const [ec, , error] = useDatos(idUnidad ? `/api/estado-cuenta?idUnidad=${idUnidad}` : null);

    const unidadesFiltradas = (unidades || []).filter((u) => {
        if (!busqueda.trim()) return true;
        const b = busqueda.toLowerCase();
        return (u.propietario && u.propietario.toLowerCase().includes(b)) ||
               (u.unidad && u.unidad.toLowerCase().includes(b)) ||
               (u.numero_unidad && u.numero_unidad.includes(b));
    });

    return (
        <div className="card">
            <h2>Estado de cuenta</h2>
            {esAdmin && (
                <div className="barra">
                    <Campo label="Buscar por nombre:">
                        <input
                            type="text"
                            placeholder="Nombre del propietario..."
                            value={busqueda}
                            onChange={(e) => setBusqueda(e.target.value)}
                        />
                    </Campo>
                    <Campo label="Departamento / Unidad">
                        <select value={idUnidad} onChange={(e) => setIdUnidad(e.target.value)}>
                            <option value="">-- Seleccione --</option>
                            {unidadesFiltradas.map((u) => <option key={u.id_unidad} value={u.id_unidad}>{u.unidad} {u.propietario ? "— " + u.propietario : ""}</option>)}
                        </select>
                    </Campo>
                </div>
            )}
            {!idUnidad ? (esAdmin ? <p className="vacio">Seleccione un departamento.</p> : <Alerta tipo="warn">Su usuario no tiene un departamento asignado.</Alerta>)
                : !ec ? <Cargando error={error} /> : (
                    <>
                        <div className="grid" style={{ marginBottom: 16 }}>
                            <Campo label="Propietario:"><input value={ec.propietario || "-"} disabled /></Campo>
                            <Campo label="Unidad Inmobiliaria:"><input value={ec.unidad} disabled /></Campo>
                        </div>
                        <div className="kpis">
                            <div className="kpi"><span>Total Cargos</span><strong>{soles(ec.total_cargos)}</strong></div>
                            <div className="kpi"><span>Total Pagado</span><strong>{soles(ec.total_pagado)}</strong></div>
                            <div className={"kpi " + (Number(ec.saldo_pendiente) > 0 ? "alerta-kpi" : "ok-kpi")}>
                                <span>Saldo Pendiente</span><strong>{soles(ec.saldo_pendiente)}</strong>
                            </div>
                        </div>
                        <h3>Detalle de Movimientos y Cuotas:</h3>
                        <div className="tabla-responsive">
                            <table>
                                <thead><tr><th>Fecha</th><th>Concepto</th><th className="num">Cargo (S/.)</th><th className="num">Abono (S/.)</th><th>Estado</th>{!esAdmin && <th></th>}</tr></thead>
                                <tbody>
                                    {ec.cuotas.length === 0 && <FilaVacia cols={6} />}
                                    {ec.cuotas.map((c) => (
                                        <tr key={c.id_cuota}>
                                            <td>{fechaTexto(c.fecha_emision)}</td>
                                            <td>Cuota Mantenimiento - {periodoTexto(c.periodo)}</td>
                                            <td className="num">{Number(c.monto_total).toFixed(2)}</td>
                                            <td className="num">{Number(c.monto_pagado).toFixed(2)}</td>
                                            <td>
                                                {Number(c.monto_en_revision) > 0 ? (
                                                    <span className="badge b-amarillo">Pagado en revisión</span>
                                                ) : (
                                                    <Estado valor={c.estado_cuota} diasAtraso={c.dias_atraso} condicionDeuda={c.condicion_deuda} />
                                                )}
                                            </td>
                                            {!esAdmin && <td>{c.estado_cuota !== "PAGADA" && Number(c.saldo) - Number(c.monto_en_revision) > 0 &&
                                                <button className="btn chico verde" onClick={() => ir("registrar-pago", { idCuota: c.id_cuota })}>Pagar</button>}</td>}
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </>
                )}
        </div>
    );
}

/** RF-016 Registrar pago + RF-017 Cargar comprobante. Metodo de pago opcional (Escenario 3). */
function RegistrarPago({ usuario, params, ir }) {
    const esAdmin = usuario.rol === "ADMINISTRADOR";
    const [cuotas, recargarCuotas] = useDatos("/api/cuotas");
    const vacio = { id_cuota: "", monto_pagado: "", metodo_pago: "", nro_operacion: "", fecha_pago: hoyISO() };
    const [f, setF] = useState({ ...vacio, id_cuota: params && params.idCuota ? String(params.idCuota) : "" });
    const [archivo, setArchivo] = useState(null);
    const [errores, setErrores] = useState({});
    const [res, setRes] = useState(null);
    const [registrado, setRegistrado] = useState(null);
    const [enviando, setEnviando] = useState(false);

    const pendientes = (cuotas || []).filter((c) => c.estado_cuota !== "PAGADA" && Number(c.saldo) - Number(c.monto_en_revision) > 0);
    const cuota = pendientes.find((c) => String(c.id_cuota) === String(f.id_cuota));
    const disponible = cuota ? Number(cuota.saldo) - Number(cuota.monto_en_revision) : 0;

    // Al elegir la cuota se propone el saldo pendiente como monto
    useEffect(() => {
        if (cuota && !f.monto_pagado) setF((x) => ({ ...x, monto_pagado: disponible.toFixed(2) }));
    }, [f.id_cuota, cuotas]);

    const cambiar = (campo) => (e) => setF({ ...f, [campo]: e.target.value });

    // Validacion en la interfaz (Escenario 2 - errores de validacion)
    const validar = () => {
        const err = {};
        if (!f.id_cuota) err.id_cuota = "Seleccione la cuota a pagar.";
        if (!f.monto_pagado || Number(f.monto_pagado) <= 0) err.monto_pagado = "El monto no puede ser cero ni negativo. Operación rechazada.";
        else if (cuota && Number(f.monto_pagado) > disponible + 0.001) err.monto_pagado = `El monto supera el saldo pendiente (${soles(disponible)}).`;
        if (f.metodo_pago && f.metodo_pago !== "EFECTIVO" && !f.nro_operacion.trim()) err.nro_operacion = "Ingrese el número de operación / voucher.";
        if (!f.fecha_pago) err.fecha_pago = "Ingrese la fecha del pago.";
        if (!esAdmin && !archivo) err.archivo = "Falta el comprobante requerido para validar la transacción.";
        if (archivo && !/\.(pdf|jpe?g|png)$/i.test(archivo.name)) err.archivo = "Formato no permitido. Solo PDF, JPG o PNG.";
        if (archivo && archivo.size > 5 * 1024 * 1024) err.archivo = "El archivo supera los 5 MB.";
        setErrores(err);
        return Object.keys(err).length === 0;
    };

    const enviar = async (e) => {
        e.preventDefault();
        setRes(null);
        if (!validar()) {
            setRes({ ok: false, titulo: "¡Error en Datos de Pago!", mensaje: "Si el monto es inválido o falta el comprobante requerido, el sistema solicita corregir la información." });
            return;
        }
        const fd = new FormData();
        Object.keys(f).forEach((k) => fd.append(k, f[k]));
        if (archivo) fd.append("archivo", archivo);
        setEnviando(true);
        try {
            const r = await API.form("/api/pagos", fd);
            setRegistrado({ ...f, cuota, r });
            setRes({ ok: true, titulo: "¡Pago Registrado Exitosamente!", mensaje: r.mensaje });
            setF(vacio); setArchivo(null); recargarCuotas();
        } catch (er) {
            setRes({ ok: false, titulo: "¡Error en Datos de Pago!", mensaje: er.message });
        }
        setEnviando(false);
    };

    if (!cuotas) return <Cargando />;

    // Pantalla de confirmacion (como la captura RF-016 evento exitoso)
    if (registrado) {
        const c = registrado.cuota;
        return (
            <div className="card">
                <Resultado res={res} />
                <div className="grid">
                    <Campo label="Propietario / Unidad:"><input disabled value={`${c.propietario || usuario.nombreCompleto} (${c.unidad})`} /></Campo>
                    <Campo label="Concepto a Pagar:"><input disabled value={"Cuota Mantenimiento - " + periodoTexto(c.periodo)} /></Campo>
                    <Campo label="Monto Pagado (S/.):"><input disabled value={soles(registrado.monto_pagado)} style={{ color: "#059669", fontWeight: 700 }} /></Campo>
                    <Campo label="N° de Operación / Voucher:"><input disabled value={registrado.nro_operacion || "-"} /></Campo>
                    <Campo label="Método de pago:"><input disabled value={registrado.metodo_pago || "No especificado"} /></Campo>
                    <Campo label="Fecha del Pago:"><input disabled value={fechaTexto(registrado.fecha_pago)} /></Campo>
                </div>
                <button className="btn verde bloque" onClick={() => { setRegistrado(null); setRes(null); }}>Registrar otro pago</button>
                <button className="btn blanco bloque" style={{ marginTop: 8 }} onClick={() => ir("pagos")}>Ver pagos realizados</button>
            </div>
        );
    }

    return (
        <div className="card">
            <h2>Registrar pago de cuota</h2>
            <Resultado res={res} />
            {pendientes.length === 0 ? <Alerta tipo="ok" titulo="¡Sin deudas!">No hay cuotas pendientes de pago.</Alerta> : (
                <form onSubmit={enviar} noValidate>
                    <div className="grid">
                        <Campo label="Cuota a pagar:" className="full" ayuda={errores.id_cuota}>
                            <select value={f.id_cuota} onChange={(e) => setF({ ...f, id_cuota: e.target.value, monto_pagado: "" })}
                                className={errores.id_cuota ? "invalido" : ""}>
                                <option value="">-- Seleccione --</option>
                                {pendientes.map((c) => (
                                    <option key={c.id_cuota} value={c.id_cuota}>
                                        {esAdmin ? c.unidad + " — " : ""}Cuota Mantenimiento - {periodoTexto(c.periodo)} — saldo {soles(Number(c.saldo) - Number(c.monto_en_revision))} ({c.estado_cuota})
                                    </option>
                                ))}
                            </select>
                        </Campo>
                        <Campo label="Monto Pagado (S/.):" ayuda={errores.monto_pagado}>
                            <input type="number" step="0.01" value={f.monto_pagado} onChange={cambiar("monto_pagado")} className={errores.monto_pagado ? "invalido" : ""} />
                        </Campo>
                        <Campo label="Fecha del Pago:" ayuda={errores.fecha_pago}>
                            <input type="date" value={f.fecha_pago} max={hoyISO()} onChange={cambiar("fecha_pago")} className={errores.fecha_pago ? "invalido" : ""} />
                        </Campo>
                        <Campo label="Método de pago (opcional):">
                            <select value={f.metodo_pago} onChange={cambiar("metodo_pago")}>
                                <option value="">-- No especificar --</option>
                                <option value="EFECTIVO">Efectivo</option>
                                <option value="YAPE">Yape</option>
                            </select>
                        </Campo>
                        <Campo label="N° de Operación / Boleta:" ayuda={errores.nro_operacion}>
                            <input value={f.nro_operacion} onChange={cambiar("nro_operacion")} placeholder="004148 o código Yape" className={errores.nro_operacion ? "invalido" : ""} />
                        </Campo>
                        <Campo label={"Comprobante de Pago " + (esAdmin ? "(opcional)" : "(PDF, JPG o PNG)") + ":"} className="full"
                            ayuda={errores.archivo || "Tamaño máximo 5 MB."}>
                            <input type="file" accept=".pdf,.jpg,.jpeg,.png" onChange={(e) => setArchivo(e.target.files[0] || null)}
                                className={errores.archivo ? "invalido" : ""} />
                        </Campo>
                    </div>
                    {esAdmin && <Alerta tipo="info">Los pagos registrados por la administración quedan validados y se emite la constancia automáticamente.</Alerta>}
                    <button className="btn verde bloque" disabled={enviando}>{enviando ? "Registrando..." : "Registrar Pago"}</button>
                </form>
            )}
        </div>
    );
}

/** RF-018 Consultar pagos / RF-019 Aprobar comprobante / RF-020 Rechazar / Anular pago. */
function ListaPagos({ usuario }) {
    const esAdmin = usuario.rol === "ADMINISTRADOR";
    const esGestion = esAdmin || usuario.rol === "JUNTA DIRECTIVA" || usuario.rol === "JUNTA";
    const [estado, setEstado] = useState(esAdmin ? "EN_REVISION" : "");
    const [busqueda, setBusqueda] = useState("");
    const [pagos, recargar, error] = useDatos(`/api/pagos?estado=${estado}`);
    const [rechazo, setRechazo] = useState(null); // {id, motivo}
    const [res, setRes] = useState(null);

    const aprobarComprobante = async (p) => {
        if (!confirm(`¿Aprobar el comprobante de pago ${p.nro_operacion || "#" + p.id_pago} de ${p.unidad} por ${soles(p.monto_pagado)}?\nEl sistema emitirá automáticamente la constancia de pago.`)) return;
        try {
            const r = await API.post(`/api/pagos/${p.id_pago}/aprobar`);
            setRes({ ok: true, titulo: "¡Comprobante Aprobado!", mensaje: r.mensaje });
            recargar();
        } catch (e) { setRes({ ok: false, mensaje: e.message }); }
    };

    const anular = async (p) => {
        const motivo = prompt(`¿Desea anular el pago #${p.id_pago} de ${p.unidad} (${soles(p.monto_pagado)})?\nIngrese el motivo de anulación:`, "Pago anulado por la administración");
        if (motivo === null) return;
        try {
            const r = await API.post(`/api/pagos/${p.id_pago}/anular`, { motivo });
            setRes({ ok: true, titulo: "Pago Anulado", mensaje: r.mensaje });
            recargar();
        } catch (e) { setRes({ ok: false, mensaje: e.message }); }
    };

    const rechazar = async () => {
        if (!rechazo.motivo.trim()) {
            setRes({ ok: false, titulo: "¡Falta el motivo!", mensaje: "Debe registrar el motivo del rechazo." });
            return;
        }
        try {
            const r = await API.post(`/api/pagos/${rechazo.id}/rechazar`, { motivo: rechazo.motivo });
            setRes({ ok: true, titulo: "Comprobante rechazado", mensaje: r.mensaje });
            setRechazo(null);
            recargar();
        } catch (e) { setRes({ ok: false, mensaje: e.message }); }
    };

    const pagosFiltrados = (pagos || []).filter((p) => {
        if (!busqueda.trim()) return true;
        const b = busqueda.toLowerCase();
        return (p.usuario && p.usuario.toLowerCase().includes(b)) ||
               (p.unidad && p.unidad.toLowerCase().includes(b)) ||
               (p.nro_operacion && p.nro_operacion.toLowerCase().includes(b));
    });

    return (
        <div className="card">
            <h2>{esGestion ? "Pagos registrados y aprobación de comprobantes" : "Mis pagos realizados"}</h2>
            {!esGestion && <div className="grid" style={{ marginBottom: 14 }}>
                <Campo label="Propietario:"><input disabled value={usuario.nombreCompleto} /></Campo>
                <Campo label="Unidad Inmobiliaria:"><input disabled value={usuario.unidad || "-"} /></Campo>
            </div>}
            <Resultado res={res} />
            {rechazo && (
                <Alerta tipo="warn" titulo={"Rechazar comprobante de pago #" + rechazo.id}>
                    <textarea rows="2" placeholder="Motivo del rechazo (obligatorio)" value={rechazo.motivo}
                        onChange={(e) => setRechazo({ ...rechazo, motivo: e.target.value })} />
                    <div className="acciones" style={{ marginTop: 8 }}>
                        <button className="btn rojo chico" onClick={rechazar}>Confirmar rechazo</button>
                        <button className="btn gris chico" onClick={() => setRechazo(null)}>Cancelar</button>
                    </div>
                </Alerta>
            )}
            <div className="barra">
                <Campo label="Buscar por nombre:">
                    <input
                        type="text"
                        placeholder="Nombre de propietario / residente..."
                        value={busqueda}
                        onChange={(e) => setBusqueda(e.target.value)}
                    />
                </Campo>
                <Campo label="Estado del pago">
                    <select value={estado} onChange={(e) => setEstado(e.target.value)}>
                        <option value="">Todos</option>
                        <option value="EN_REVISION">Pagado en revisión</option>
                        <option value="VALIDADO">Aprobado / Validado</option>
                        <option value="RECHAZADO">Rechazado</option>
                        <option value="ANULADO">Anulado</option>
                    </select>
                </Campo>
            </div>
            {!pagos ? <Cargando error={error} /> : (
                <div className="tabla-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>Fecha Operación</th>{esGestion && <th>Unidad</th>}<th>Concepto</th><th>N° Operación / Voucher</th>
                                <th>Método</th><th className="num">Monto (S/.)</th><th>Estado</th><th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            {pagosFiltrados.length === 0 && <FilaVacia cols={8} />}
                            {pagosFiltrados.map((p) => (
                                <tr key={p.id_pago}>
                                    <td>{fechaTexto(p.fecha_pago)}</td>
                                    {esGestion && <td>{p.unidad}<div className="ayuda">{p.usuario}</div></td>}
                                    <td>Cuota Mantenimiento - {periodoTexto(p.periodo)}</td>
                                    <td>{p.nro_operacion || "-"}</td>
                                    <td>{p.metodo_pago || "No especificado"}</td>
                                    <td className="num">{Number(p.monto_pagado).toFixed(2)}</td>
                                    <td>
                                        <Estado valor={p.estado_pago} />
                                        {p.observacion && <div className="ayuda">Motivo: {p.observacion}</div>}
                                    </td>
                                    <td className="acciones">
                                        {p.id_comprobante && <a className="btn chico blanco" href={API.urlComprobante(p.id_comprobante)} target="_blank">Comprobante</a>}
                                        {p.numero_recibo && <span className="badge b-azul">{p.numero_recibo}</span>}
                                        {esAdmin && p.estado_pago === "EN_REVISION" && <>
                                            <button className="btn chico verde" title="Aprobar comprobante y emitir constancia" onClick={() => aprobarComprobante(p)}>Aprobar</button>
                                            <button className="btn chico rojo" onClick={() => setRechazo({ id: p.id_pago, motivo: "" })}>Rechazar</button>
                                        </>}
                                        {esAdmin && p.estado_pago !== "ANULADO" && (
                                            <button className="btn chico gris" title="Anular pago y revertir cuota" onClick={() => anular(p)}>Anular</button>
                                        )}
                                    </td>
                                </tr>
                            ))}
                        </tbody>
                    </table>
                </div>
            )}
        </div>
    );
}

                            {dpto}

                    </div>

                    <div style={{ marginTop: 22, lineHeight: "2.2" }}>

                            <b>Por concepto de :</b> &nbsp; <span style={{ fontSize: 16 }}>{conceptoRecibo}</span>
                        </div>

                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-end", marginTop: 26 }}>

                            <div style={{
                                border: "2px solid #1d4ed8", borderRadius: "50%", padding: "10px 16px",
                                color: "#1d4ed8", textAlign: "center", fontSize: 10, fontWeight: 700, transform: "rotate(-6deg)"
                            }}>
                                <div>EDIFICIO 73</div>
                                <div style={{ border: "1px solid #1d4ed8", padding: "1px 6px", margin: "3px 0" }}>LA DIRECTIVA</div>
                                <div>LA CRUCETA - SURCO</div>
                            </div>

                    </table>
                </div>
            )}
        </div>
    );
}

    return (
        <div className="card">
            <h2>Dashboard administrativo</h2>
            <div className="barra">
                <Campo label="Periodo">
                    <select value={periodo || d.periodo} onChange={(e) => setPeriodo(e.target.value)}>
                        {(periodos || []).map((p) => <option key={p} value={p}>{periodoTexto(p)}</option>)}
                    </select>
                </Campo>
            </div>
            <h3>Recaudación de {periodoTexto(d.periodo)}</h3>
            <div className="kpis">
                <div className="kpi"><span>Total emitido</span><strong>{soles(d.total_emitido)}</strong></div>
                <div className="kpi ok-kpi"><span>Total recaudado ({avance}%)</span><strong>{soles(d.total_recaudado)}</strong></div>
                <div className="kpi alerta-kpi"><span>Saldo pendiente del periodo</span><strong>{soles(d.total_pendiente)}</strong></div>
                <div className="kpi"><span>Cuotas pagadas / emitidas</span><strong>{d.pagadas} / {d.cuotas}</strong></div>
            </div>
            <h3>Situación general</h3>
            <div className="kpis">
                <div className="kpi"><span>Departamentos activos</span><strong>{d.unidades}</strong></div>
                <div className="kpi alerta-kpi"><span>Pagos por validar</span><strong>{d.pagos_en_revision}</strong></div>
                <div className="kpi"><span>Morosos (&gt; 30 días)</span><strong style={{ color: "#b91c1c" }}>{d.total_morosos ?? d.unidades_morosas}</strong></div>
                <div className="kpi"><span>Deudores (&le; 30 días)</span><strong style={{ color: "#d97706" }}>{d.total_deudores ?? 0}</strong></div>
                <div className="kpi"><span>Deuda vencida ({d.cuotas_vencidas} cuotas)</span><strong style={{ color: "#b91c1c" }}>{soles(d.deuda_vencida)}</strong></div>
            </div>
            <div className="acciones">
                <button className="btn verde" onClick={() => ir("conceptos")}>Conceptos y cálculo de cuotas</button>
                <button className="btn" onClick={() => ir("pagos")}>Validar pagos ({d.pagos_en_revision})</button>
                <button className="btn rojo" onClick={() => ir("morosidad")}>Ver morosidad</button>
            </div>
        </div>
    );
}

/** RF-001 Registrar usuario / RF-006 Roles / Consultar usuarios / Reactivar usuario */
function Usuarios() {
    const [usuarios, recargar, error] = useDatos("/api/usuarios");
    const [roles] = useDatos("/api/roles");
    const [unidades] = useDatos("/api/unidades");
    const vacio = { nombre: "", apellido: "", dni: "", id_unidad: "", id_rol: "2", correo: "", telefono: "", fecha_nacimiento: "", direccion: "", contrasena: "" };
    const [f, setF] = useState(vacio);
    const [busqueda, setBusqueda] = useState("");
    const [filtroRol, setFiltroRol] = useState("");
    const [filtroEstado, setFiltroEstado] = useState("");
    const [res, setRes] = useState(null);
    const c = (k) => (e) => setF({ ...f, [k]: e.target.value });

    const registrar = async (e) => {
        e.preventDefault();
        try {
            const r = await API.post("/api/usuarios", f);
            setRes({ ok: true, titulo: "¡Registro Exitoso!", mensaje: `${f.nombre} ${f.apellido} fue registrado. ${r.mensaje}` });
            setF(vacio); recargar();
        } catch (er) { setRes({ ok: false, titulo: "¡Error en el registro!", mensaje: er.message }); }
    };

    const cambiarRol = async (u, idRol) => {
        try { const r = await API.put(`/api/usuarios/${u.id_usuario}/rol`, { id_rol: idRol }); setRes({ ok: true, mensaje: r.mensaje }); recargar(); }
        catch (er) { setRes({ ok: false, mensaje: er.message }); }
    };

    const cambiarEstado = async (u, confirmar) => {
        const nuevoEstado = u.estado_cuenta === "ACTIVO" ? "INACTIVO" : "ACTIVO";
        try {
            const r = await API.put(`/api/usuarios/${u.id_usuario}/estado`, { estado: nuevoEstado, confirmar: !!confirmar });
            setRes({ ok: true, titulo: nuevoEstado === "ACTIVO" ? "Usuario Reactivado" : "Usuario Desactivado", mensaje: r.mensaje });
            recargar();
        } catch (er) {
            // 409 = tiene cuotas pendientes -> se pide confirmacion
            if (er.status === 409 && confirm(er.message)) return cambiarEstado(u, true);
            if (er.status !== 409) setRes({ ok: false, mensaje: er.message });
        }
    };

    const usuariosFiltrados = (usuarios || []).filter((u) => {
        if (filtroRol && String(u.id_rol) !== String(filtroRol)) return false;
        if (filtroEstado && u.estado_cuenta !== filtroEstado) return false;
        if (!busqueda.trim()) return true;
        const b = busqueda.toLowerCase();
        return (u.nombre && u.nombre.toLowerCase().includes(b)) ||
               (u.apellido && u.apellido.toLowerCase().includes(b)) ||
               (u.dni && u.dni.includes(b)) ||
               (u.unidad && u.unidad.toLowerCase().includes(b)) ||
               (u.correo && u.correo.toLowerCase().includes(b));
    });

    return (
        <>
            <div className="card">
                <h2>Registrar propietario o residente</h2>
                <Resultado res={res} />
                <form onSubmit={registrar}>
                    <div className="grid">
                        <Campo label="Nombres:"><input value={f.nombre} onChange={c("nombre")} /></Campo>
                        <Campo label="Apellidos:"><input value={f.apellido} onChange={c("apellido")} /></Campo>
                        <Campo label="DNI:"><input value={f.dni} maxLength="8" onChange={c("dni")} /></Campo>
                        <Campo label="Fecha de nacimiento:"><input type="date" value={f.fecha_nacimiento} onChange={c("fecha_nacimiento")} /></Campo>
                        <Campo label="Número de Departamento:">
                            <select value={f.id_unidad} onChange={c("id_unidad")}>
                                <option value="">-- Seleccione --</option>
                                {(unidades || []).map((u) => <option key={u.id_unidad} value={u.id_unidad}>{u.unidad}{u.propietario ? " (dueño: " + u.propietario + ")" : " (sin dueño)"}</option>)}
                            </select>
                        </Campo>
                        <Campo label="Tipo de Usuario:">
                            <select value={f.id_rol} onChange={c("id_rol")}>
                                {(roles || []).map((r) => <option key={r.id_rol} value={r.id_rol}>{r.nombre_rol}</option>)}
                            </select>
                        </Campo>
                        <Campo label="Correo Electrónico:"><input value={f.correo} onChange={c("correo")} /></Campo>
                        <Campo label="Teléfono / Celular:"><input value={f.telefono} maxLength="9" onChange={c("telefono")} /></Campo>
                        <Campo label="Dirección:"><input value={f.direccion} onChange={c("direccion")} /></Campo>
                        <Campo label="Contraseña inicial:" ayuda="Si se deja vacía, la contraseña será el DNI."><input type="password" value={f.contrasena} onChange={c("contrasena")} /></Campo>
                    </div>
                    <button className="btn verde bloque">Registrar Usuario</button>
                </form>
            </div>
            <div className="card">
                <h2>Consultar usuarios del sistema</h2>
                <div className="barra">
                    <Campo label="Buscar por nombre, DNI o dpto:">
                        <input
                            type="text"
                            placeholder="Nombre, apellido, DNI, correo..."
                            value={busqueda}
                            onChange={(e) => setBusqueda(e.target.value)}
                        />
                    </Campo>
                    <Campo label="Filtrar por Rol:">
                        <select value={filtroRol} onChange={(e) => setFiltroRol(e.target.value)}>
                            <option value="">Todos los roles</option>
                            {(roles || []).map((r) => <option key={r.id_rol} value={r.id_rol}>{r.nombre_rol}</option>)}
                        </select>
                    </Campo>
                    <Campo label="Filtrar por Estado:">
                        <select value={filtroEstado} onChange={(e) => setFiltroEstado(e.target.value)}>
                            <option value="">Todos los estados</option>
                            <option value="ACTIVO">Activo</option>
                            <option value="INACTIVO">Inactivo</option>
                        </select>
                    </Campo>
                </div>
                {!usuarios ? <Cargando error={error} /> : (
                    <div className="tabla-responsive">
                        <table>
                            <thead><tr><th>DNI</th><th>Nombre</th><th>Unidad</th><th>Correo</th><th>Teléfono</th><th>Rol</th><th>Estado</th><th>Acciones</th></tr></thead>
                            <tbody>
                                {usuariosFiltrados.length === 0 && <FilaVacia cols={8} />}
                                {usuariosFiltrados.map((u) => (
                                    <tr key={u.id_usuario}>
                                        <td>{u.dni}</td>
                                        <td>{u.nombre} {u.apellido}</td>
                                        <td>{u.unidad || "-"}</td>
                                        <td>{u.correo}</td>
                                        <td>{u.telefono}</td>
                                        <td>
                                            <select value={u.id_rol} onChange={(e) => cambiarRol(u, e.target.value)} style={{ padding: 4 }}>
                                                {(roles || []).map((r) => <option key={r.id_rol} value={r.id_rol}>{r.nombre_rol}</option>)}
                                            </select>
                                        </td>
                                        <td><Estado valor={u.estado_cuenta} /></td>
                                        <td>
                                            <button
                                                className={"btn chico " + (u.estado_cuenta === "ACTIVO" ? "rojo" : "verde")}
                                                onClick={() => cambiarEstado(u)}
                                                title={u.estado_cuenta === "ACTIVO" ? "Desactivar cuenta de usuario" : "Reactivar cuenta de usuario"}
                                            >
                                                {u.estado_cuenta === "ACTIVO" ? "Desactivar" : "Reactivar"}
                                            </button>
                                        </td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                )}
            </div>
        </>
    );
}

/** RF-002 Registrar unidad / Modificar unidad / RF-048 Historial de pagos por unidad */
function Unidades() {
    const [unidades, recargar, error] = useDatos("/api/unidades");
    const [f, setF] = useState({ bloque: "Piso 1", numero_unidad: "", estado: "ACTIVA" });
    const [editando, setEditando] = useState(null); // unidad en edicion
    const [res, setRes] = useState(null);
    const [historial, setHistorial] = useState(null);
    const [busquedaUnidad, setBusquedaUnidad] = useState("");
    const [busquedaHist, setBusquedaHist] = useState("");
    const [pagos] = useDatos(historial ? `/api/pagos?idUnidad=${historial.id_unidad}` : null);

    const guardar = async (e) => {
        e.preventDefault();
        try {
            if (editando) {
                const r = await API.put(`/api/unidades/${editando.id_unidad}`, f);
                setRes({ ok: true, titulo: "¡Unidad modificada!", mensaje: r.mensaje });
                setEditando(null);
            } else {
                const r = await API.post("/api/unidades", f);
                setRes({ ok: true, titulo: "¡Unidad registrada!", mensaje: r.mensaje });
            }
            setF({ bloque: "Piso 1", numero_unidad: "", estado: "ACTIVA" });
            recargar();
        } catch (er) { setRes({ ok: false, mensaje: er.message }); }
    };

    const iniciarEdicion = (u) => {
        setEditando(u);
        setF({ bloque: u.bloque, numero_unidad: u.numero_unidad, estado: u.estado });
        window.scrollTo({ top: 0, behavior: "smooth" });
    };

    const cancelarEdicion = () => {
        setEditando(null);
        setF({ bloque: "Piso 1", numero_unidad: "", estado: "ACTIVA" });
    };

    const cambiarEstado = async (u) => {
        try { await API.put(`/api/unidades/${u.id_unidad}`, { estado: u.estado === "ACTIVA" ? "INACTIVA" : "ACTIVA" }); recargar(); }
        catch (er) { setRes({ ok: false, mensaje: er.message }); }
    };

    const unidadesFiltradas = (unidades || []).filter((u) => {
        if (!busquedaUnidad.trim()) return true;
        const b = busquedaUnidad.toLowerCase();
        return (u.propietario && u.propietario.toLowerCase().includes(b)) ||
               (u.numero_unidad && u.numero_unidad.includes(b)) ||
               (u.bloque && u.bloque.toLowerCase().includes(b));
    });

    const pagosHistFiltrados = (pagos || []).filter((p) => {
        if (!busquedaHist.trim()) return true;
        const b = busquedaHist.toLowerCase();
        return (p.usuario && p.usuario.toLowerCase().includes(b)) ||
               (p.nro_operacion && p.nro_operacion.toLowerCase().includes(b));
    });

    return (
        <>
            <div className="card">
                <h2>{editando ? `Modificar departamento — ${editando.bloque} Dpto. ${editando.numero_unidad}` : "Registrar departamento por piso"}</h2>
                <Resultado res={res} />
                <form onSubmit={guardar} className="grid3">
                    <Campo label="Piso o Bloque:"><input value={f.bloque} placeholder="ej. Piso 1" onChange={(e) => setF({ ...f, bloque: e.target.value })} /></Campo>
                    <Campo label="N° de departamento:"><input value={f.numero_unidad} placeholder="ej. 101" onChange={(e) => setF({ ...f, numero_unidad: e.target.value })} /></Campo>
                    <Campo label="Estado:">
                        <select value={f.estado} onChange={(e) => setF({ ...f, estado: e.target.value })}>
                            <option value="ACTIVA">Activa</option><option value="INACTIVA">Inactiva</option>
                        </select>
                    </Campo>
                    <div className="full acciones">
                        <button className="btn verde">{editando ? "Guardar Modificación" : "Registrar Unidad"}</button>
                        {editando && <button type="button" className="btn gris" onClick={cancelarEdicion}>Cancelar Edición</button>}
                    </div>
                </form>
            </div>
            {historial && (
                <div className="card" style={{ borderColor: "#0ea5e9" }}>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
                        <h2 style={{ margin: 0 }}>Historial de pagos — {historial.unidad}</h2>
                        <button className="btn gris chico" onClick={() => setHistorial(null)}>Cerrar</button>
                    </div>
                    <div className="barra" style={{ marginBottom: 12 }}>
                        <Campo label="Buscar en historial:">
                            <input
                                type="text"
                                placeholder="Nombre de quien pagó / nro operación..."
                                value={busquedaHist}
                                onChange={(e) => setBusquedaHist(e.target.value)}
                            />
                        </Campo>
                    </div>
                    {!pagos ? <Cargando /> : (
                        <div className="tabla-responsive">
                            <table>
                                <thead><tr><th>Fecha</th><th>Periodo</th><th>Pagado por</th><th>N° Operación</th><th className="num">Monto</th><th>Estado</th></tr></thead>
                                <tbody>
                                    {pagosHistFiltrados.length === 0 && <FilaVacia cols={6} />}
                                    {pagosHistFiltrados.map((p) => (
                                        <tr key={p.id_pago}>
                                            <td>{fechaTexto(p.fecha_pago)}</td>
                                            <td>{periodoTexto(p.periodo)}</td>
                                            <td>{p.usuario}</td>
                                            <td>{p.nro_operacion || "-"}</td>
                                            <td className="num">{Number(p.monto_pagado).toFixed(2)}</td>
                                            <td><Estado valor={p.estado_pago} /></td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    )}
                </div>
            )}
            <div className="card">
                <h2>Distribución de departamentos por pisos</h2>
                <div className="barra">
                    <Campo label="Buscar por nombre o dpto:">
                        <input
                            type="text"
                            placeholder="Propietario, piso o dpto..."
                            value={busquedaUnidad}
                            onChange={(e) => setBusquedaUnidad(e.target.value)}
                        />
                    </Campo>
                </div>
                {!unidades ? <Cargando error={error} /> : (
                    <div className="tabla-responsive">
                        <table>
                            <thead><tr><th>Piso</th><th>N° Dpto</th><th>Propietario (dueño)</th><th>Estado</th><th>Acciones</th></tr></thead>
                            <tbody>
                                {unidadesFiltradas.length === 0 && <FilaVacia cols={5} />}
                                {unidadesFiltradas.map((u) => (
                                    <tr key={u.id_unidad}>
                                        <td><b>{u.bloque || ("Piso " + (u.numero_unidad ? u.numero_unidad.charAt(0) : ""))}</b></td>
                                        <td>Dpto. {u.numero_unidad}</td>
                                        <td>{u.propietario || <i>Sin propietario</i>}</td>
                                        <td><Estado valor={u.estado} /></td>
                                        <td className="acciones">
                                            <button className="btn chico blanco" title="Modificar piso, número o estado de la unidad" onClick={() => iniciarEdicion(u)}>Editar</button>
                                            <button className="btn chico blanco" onClick={() => setHistorial(u)}>Historial de pagos</button>
                                            <button className="btn chico gris" onClick={() => cambiarEstado(u)}>{u.estado === "ACTIVA" ? "Inactivar" : "Activar"}</button>
                                        </td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                )}
            </div>
        </>
    );
}

/** RF-009 / RF-010 / RF-011 / RF-030 Conceptos de cobro, cálculo mensual e historial de pagos de inquilinos */
function Conceptos() {
    const [conceptos, recargarConceptos, error] = useDatos("/api/conceptos");
    const [periodos] = useDatos("/api/cuotas/periodos");
    const [cuotas, recargarCuotas] = useDatos("/api/cuotas");
    const [pagos] = useDatos("/api/pagos");

    // Formulario de nuevo concepto
    const vacio = { id_concepto: null, nombre_concepto: "", tipo_concepto: "COBRO", monto_base: "" };
    const [f, setF] = useState(vacio);
    const [filtroTipo, setFiltroTipo] = useState("");
    const [res, setRes] = useState(null);

    // Calculo y generacion mensual
    const sig = new Date(); sig.setMonth(sig.getMonth() + 1);
    const [periodoGen, setPeriodoGen] = useState(sig.toISOString().substring(0, 7));
    const [vencimiento, setVencimiento] = useState("");
    const [gastos, setGastos] = useState({});
    const [calculo, setCalculo] = useState(null);
    const [enviando, setEnviando] = useState(false);

    // Historial de pagos por mes e inquilino
    const [mesHistorial, setMesHistorial] = useState("2026-10");
    const [busquedaInquilino, setBusquedaInquilino] = useState("");

    // Por defecto se propone el monto base de cada concepto
    useEffect(() => {
        if (conceptos) {
            const g = {};
            conceptos.forEach((c) => (g[c.id_concepto] = c.monto_base));
            setGastos(g);
        }
    }, [conceptos]);

    // Vencimiento por defecto: ultimo dia del periodo
    useEffect(() => {
        if (periodoGen) {
            const [a, m] = periodoGen.split("-").map(Number);
            setVencimiento(`${periodoGen}-${String(new Date(a, m, 0).getDate()).padStart(2, "0")}`);
        }
    }, [periodoGen]);

    const guardarConcepto = async (e) => {
        e.preventDefault();
        try {
            const r = f.id_concepto ? await API.put(`/api/conceptos/${f.id_concepto}`, f) : await API.post("/api/conceptos", f);
            setRes({ ok: true, titulo: "¡Concepto guardado!", mensaje: r.mensaje });
            setF(vacio); recargarConceptos();
        } catch (er) { setRes({ ok: false, mensaje: er.message }); }
    };

    const listaGastos = () => Object.keys(gastos).map((id) => ({ id_concepto: Number(id), monto: gastos[id] }));

    const calcular = async () => {
        setRes(null);
        try {
            setCalculo(await API.post("/api/cuotas/calcular", { gastos: listaGastos() }));
        } catch (e) {
            setCalculo(null);
            setRes({ ok: false, titulo: "¡Error en el cálculo!", mensaje: e.message });
        }
    };

    const generar = async () => {
        setEnviando(true);
        try {
            const r = await API.post("/api/cuotas/generar", { periodo: periodoGen, fecha_vencimiento: vencimiento, gastos: listaGastos() });
            setCalculo(r);
            setRes({ ok: true, titulo: "¡Cuotas Generadas y Notificadas!", mensaje: r.mensaje });
            recargarCuotas();
        } catch (e) {
            setRes({ ok: false, titulo: "¡No se pudo generar la cuota!", mensaje: e.message });
        }
        setEnviando(false);
    };

    if (!conceptos) return <Cargando error={error} />;

    // Filtrado de cuotas para el historial de pagos de inquilinos
    const cuotasHistFiltradas = (cuotas || []).filter((c) => {
        if (mesHistorial && c.periodo !== mesHistorial) return false;
        if (!busquedaInquilino.trim()) return true;
        const b = busquedaInquilino.toLowerCase();
        return (c.propietario && c.propietario.toLowerCase().includes(b)) ||
               (c.unidad && c.unidad.toLowerCase().includes(b));
    });

    // Suma de los pagos del mes seleccionado
    const totalPagadoMes = cuotasHistFiltradas.reduce((acc, c) => acc + Number(c.monto_pagado || 0), 0);
    const totalCuotasMes = cuotasHistFiltradas.reduce((acc, c) => acc + Number(c.monto_total || 0), 0);
    const inquilinosPagados = cuotasHistFiltradas.filter((c) => c.estado_cuota === "PAGADA" || Number(c.monto_pagado) > 0).length;

    // Mapa de metodos de pago por cuota
    const mapaPagos = {};
    (pagos || []).forEach((p) => {
        if (p.id_cuota && (!mapaPagos[p.id_cuota] || p.estado_pago === "VALIDADO")) {
            mapaPagos[p.id_cuota] = p;
        }
    });

    const conceptosFiltrados = (conceptos || []).filter((k) => {
        if (!filtroTipo) return true;
        return k.tipo_concepto === filtroTipo;
    });

    return (
        <div>
            {/* 1. SECCION DE CALCULO Y EMISION MENSUAL */}
            <div className="card">
                <h2>Cálculo y distribución de cuota mensual según gastos</h2>
                <Alerta tipo="info">
                    Ingrese el gasto real del mes en cada concepto. El sistema suma los gastos del edificio y los divide entre los 20 departamentos para calcular y emitir la cuota de cada uno.
                </Alerta>
                <Resultado res={res} />
                <div className="grid">
                    <Campo label="Periodo a calcular / emitir:">
                        <input type="month" value={periodoGen} onChange={(e) => setPeriodoGen(e.target.value)} />
                    </Campo>
                    <Campo label="Fecha de vencimiento:">
                        <input type="date" value={vencimiento} onChange={(e) => setVencimiento(e.target.value)} />
                    </Campo>
                </div>

                <h3 style={{ marginTop: 18, color: "#1e3a8a" }}>Gastos del mes por concepto ({periodoTexto(periodoGen)})</h3>
                <div className="tabla-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>Concepto</th>
                                <th>Tipo</th>
                                <th className="num">Monto referencial</th>
                                <th style={{ width: 190 }}>Gasto real del mes (S/.)</th>
                            </tr>
                        </thead>
                        <tbody>
                            {conceptos.map((c) => (
                                <tr key={c.id_concepto}>
                                    <td><b>{c.nombre_concepto}</b></td>
                                    <td><span className="badge b-azul">{c.tipo_concepto}</span></td>
                                    <td className="num">{soles(c.monto_base)}</td>
                                    <td>
                                        <input
                                            type="number"
                                            step="0.01"
                                            min="0"
                                            value={gastos[c.id_concepto] ?? ""}
                                            className={gastos[c.id_concepto] === "" ? "invalido" : ""}
                                            onChange={(e) => {
                                                setGastos({ ...gastos, [c.id_concepto]: e.target.value });
                                                setCalculo(null);
                                            }}
                                        />
                                    </td>
                                </tr>
                            ))}
                        </tbody>
                    </table>
                </div>

                {calculo && (
                    <div className="kpis" style={{ marginTop: 16 }}>
                        <div className="kpi"><span>Gasto total del edificio</span><strong>{soles(calculo.total_edificio)}</strong></div>
                        <div className="kpi"><span>Departamentos activos</span><strong>{calculo.unidades}</strong></div>
                        <div className="kpi"><span>Sin vigilancia (101, 301, 401, 402, 502)</span><strong>{soles(calculo.monto_sin_vigilancia)}</strong></div>
                        <div className="kpi ok-kpi"><span>Aporte con vigilancia (15 dptos)</span><strong>{soles(calculo.monto_por_unidad)}</strong></div>
                    </div>
                )}

                <div className="acciones" style={{ marginTop: 16 }}>
                    <button className="btn blanco" onClick={calcular}>Calcular monto de cuota</button>
                    <button className="btn verde" onClick={generar} disabled={enviando}>
                        {enviando ? "Generando..." : "Generar y notificar cuotas"}
                    </button>
                </div>
            </div>

            {/* 2. HISTORIAL DE PAGOS DE LOS ANTERIORES MESES POR INQUILINO Y SUMA DEL MES */}
            <div className="card">
                <h2>Historial de pagos de inquilinos de anteriores meses</h2>
                <p style={{ color: "#475569", margin: "4px 0 14px 0" }}>
                    Registro histórico y detalle de los pagos realizados por cada inquilino / propietario según los datos del edificio (Agosto, Septiembre y Octubre 2026).
                </p>

                <div className="barra">
                    <Campo label="Seleccionar mes / periodo:">
                        <select value={mesHistorial} onChange={(e) => setMesHistorial(e.target.value)}>
                            <option value="">Todos los meses</option>
                            {(periodos || []).map((p) => (
                                <option key={p} value={p}>{periodoTexto(p)}</option>
                            ))}
                        </select>
                    </Campo>

/** RF-024 Consultar morosidad / RF-025 Reporte / RF-042 Filtro pendiente-vencida / Alertar morosidad */
function Morosidad() {
    const [filtro, setFiltro] = useState("VENCIDA");
    const [filas, recargar, error] = useDatos(`/api/morosidad?filtro=${filtro}`);
    const [busqueda, setBusqueda] = useState("");
    const [res, setRes] = useState(null);

    if (!filas) return <Cargando error={error} />;

    const alertar = async (c) => {
        try {
            const r = await API.post("/morosidad/alertar", c ? { id_cuota: c.id_cuota } : {});
            setRes({ ok: true, titulo: "Alerta de morosidad", mensaje: r.mensaje });
        } catch (e) {
            setRes({ ok: false, mensaje: e.message });
        }
    };

    const filasFiltradas = (filas || []).filter((f) => {
        if (!busqueda.trim()) return true;
        const b = busqueda.toLowerCase();
        return (f.propietario && f.propietario.toLowerCase().includes(b)) ||
               (f.unidad && f.unidad.toLowerCase().includes(b)) ||
               (f.periodo && f.periodo.includes(b));
    });

    const total = filasFiltradas.reduce((s, f) => s + Number(f.saldo), 0);
    const unidades = new Set(filasFiltradas.map((f) => f.id_unidad)).size;
    const totalMorosos = filasFiltradas.filter((f) => Number(f.dias_atraso || 0) > 30).length;
    const totalDeudores = filasFiltradas.filter((f) => Number(f.dias_atraso || 0) > 0 && Number(f.dias_atraso || 0) <= 30).length;

    const exportar = () => exportarCSV("reporte_morosidad.csv", [
        { titulo: "Unidad", valor: (f) => f.unidad },
        { titulo: "Propietario", valor: (f) => f.propietario },
        { titulo: "Telefono", valor: (f) => f.telefono },
        { titulo: "Periodo", valor: (f) => periodoTexto(f.periodo) },
        { titulo: "Vencimiento", valor: (f) => fechaTexto(f.fecha_vencimiento) },
        { titulo: "Dias de atraso", valor: (f) => f.dias_atraso },
        { titulo: "Condicion", valor: (f) => Number(f.dias_atraso) > 30 ? "MOROSO (> 30 dias)" : Number(f.dias_atraso) > 0 ? "DEUDOR (<= 30 dias)" : "AL DIA" },
        { titulo: "Saldo (S/.)", valor: (f) => Number(f.saldo).toFixed(2) },
    ], filasFiltradas);

    return (
        <div className="card">
            <h2>Reporte de morosidad y cobranza</h2>
            <Resultado res={res} />
            <div className="kpis">
                <div className="kpi"><span>Departamentos con deuda</span><strong style={{ color: "#b91c1c" }}>{unidades}</strong></div>
                <div className="kpi"><span>Morosos (&gt; 30 días)</span><strong style={{ color: "#b91c1c" }}>{totalMorosos}</strong></div>
                <div className="kpi"><span>Deudores (&le; 30 días)</span><strong style={{ color: "#d97706" }}>{totalDeudores}</strong></div>
                <div className="kpi alerta-kpi"><span>Deuda acumulada total</span><strong>{soles(total)}</strong></div>
            </div>
            <div className="barra no-print">
                <Campo label="Buscar por nombre o dpto:">
                    <input
                        type="text"
                        placeholder="Nombre de propietario o dpto..."
                        value={busqueda}
                        onChange={(e) => setBusqueda(e.target.value)}
                    />
                </Campo>
                <Campo label="Filtro de clasificación (RF-042):">
                    <select value={filtro} onChange={(e) => setFiltro(e.target.value)}>
                        <option value="VENCIDA">Todas las deudas vencidas</option>
                        <option value="MOROSO">Solo Morosos (&gt; 30 días de demora)</option>
                        <option value="DEUDOR">Solo Deudores (&le; 30 días de retraso)</option>
                        <option value="PENDIENTE">Solo cuotas pendientes</option>
                        <option value="TODAS">Todas las cuotas por cobrar</option>
                    </select>
                </Campo>
            </div>
            <div className="acciones no-print" style={{ marginBottom: 12 }}>
                <button className="btn rojo" title="Emitir alerta formal de morosidad a todos los dptos morosos" onClick={() => alertar(null)}>Alertar a todos los morosos</button>
                <button className="btn" onClick={exportar}>Exportar a Excel (CSV)</button>
                <button className="btn gris" onClick={() => window.print()}>Imprimir reporte</button>
            </div>
            <div className="tabla-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Unidad</th><th>Propietario</th><th>Teléfono</th><th>Periodo</th>
                            <th>Vencimiento</th><th className="num">Días atraso</th><th>Condición</th><th className="num">Saldo (S/.)</th><th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        {filasFiltradas.length === 0 && <FilaVacia cols={9} texto="No hay cuotas con el filtro seleccionado. ¡Al día!" />}
                        {filasFiltradas.map((f) => (
                            <tr key={f.id_cuota}>
                                <td>{f.unidad}</td><td>{f.propietario || "-"}</td><td>{f.telefono || "-"}</td>
                                <td>{periodoTexto(f.periodo)}</td><td>{fechaTexto(f.fecha_vencimiento)}</td>
                                <td className="num">{f.dias_atraso}</td>
                                <td>
                                    {Number(f.dias_atraso) > 30 ? (
                                        <span className="badge b-rojo" title="Más de 30 días de demora en el pago">Moroso (&gt; 30d)</span>
                                    ) : Number(f.dias_atraso) > 0 ? (
                                        <span className="badge b-amarillo" title="Menos de 30 días de retraso">Deudor (&le; 30d)</span>
                                    ) : (
                                        <span className="badge b-verde">Al día</span>
                                    )}
                                </td>
                                <td className="num">{Number(f.saldo).toFixed(2)}</td>
                                <td className="acciones">
                                    <button className="btn chico rojo" title="Enviar alerta formal de morosidad" onClick={() => alertar(f)}>Alertar</button>
                                </td>
                            </tr>
                        ))}
                    </tbody>
                </table>
            </div>
        </div>
    );
}

/** RF-007 Actualizar datos de perfil (todos los roles) */
function Perfil() {
    const [p] = useDatos("/api/perfil");
    const [f, setF] = useState(null);
    const [res, setRes] = useState(null);
    useEffect(() => { if (p) setF({ ...p, contrasena_actual: "", contrasena_nueva: "" }); }, [p]);
    if (!f) return <Cargando />;
    const c = (k) => (e) => setF({ ...f, [k]: e.target.value });
    const guardar = async (e) => {
        e.preventDefault();
        try {
            const r = await API.put("/api/perfil", f);
            setRes({ ok: true, titulo: "¡Perfil actualizado!", mensaje: r.mensaje });
            setF({ ...f, contrasena_actual: "", contrasena_nueva: "" });
        } catch (er) { setRes({ ok: false, mensaje: er.message }); }
    };
    return (
        <div className="card">
            <h2>Mi perfil</h2>
            <Resultado res={res} />
            <form onSubmit={guardar}>
                <div className="grid">
                    <Campo label="Nombres y apellidos:"><input disabled value={f.nombre + " " + f.apellido} /></Campo>
                    <Campo label="DNI:"><input disabled value={f.dni} /></Campo>
                    <Campo label="Rol:"><input disabled value={f.nombre_rol} /></Campo>
                    <Campo label="Unidad:"><input disabled value={f.unidad || "-"} /></Campo>
                    <Campo label="Correo electrónico:"><input value={f.correo} onChange={c("correo")} /></Campo>
                    <Campo label="Teléfono / Celular:"><input value={f.telefono || ""} maxLength="9" onChange={c("telefono")} /></Campo>
                    <Campo label="Dirección:" className="full"><input value={f.direccion || ""} onChange={c("direccion")} /></Campo>
                    <Campo label="Contraseña actual:" ayuda="Solo si desea cambiar su contraseña."><input type="password" value={f.contrasena_actual} onChange={c("contrasena_actual")} /></Campo>
                    <Campo label="Nueva contraseña:"><input type="password" value={f.contrasena_nueva} onChange={c("contrasena_nueva")} /></Campo>
                </div>
                <button className="btn verde bloque">Guardar cambios</button>
            </form>
        </div>
    );
}
